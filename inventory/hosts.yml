---
# inventory/hosts.yml - WHICH machines Ansible manages, organised in groups.
#
#   all
#   └── windchill              every Windchill server, whatever the environment
#       ├── lab                your own PC running the fake Windchill (lab/)
#       ├── dev
#       ├── ppe
#       └── live
#
# Variables:  group_vars/windchill/  = shared by all environments
#             group_vars/<env>/      = what differs per environment (wins over windchill)
#             host_vars/<host>.yml   = what differs per server (wins over both)
#
# Playbooks pick the environment with  -e target=dev  (default: lab), so a
# forgotten option can never touch live.
all:
  children:
    windchill:
      children:

        lab:
          hosts:
            fakewc:
              # Docker Desktop resolves this to the Windows host the container runs on.
              ansible_host: host.docker.internal

        dev:
          hosts:
            wcdev01:
              ansible_host: wcdev01.example.local     # DNS name or IP of the dev server

        ppe:
          hosts:
            wcppe01:
              ansible_host: wcppe01.example.local

        live:
          hosts:
            wclive01:
              ansible_host: wclive01.example.local
