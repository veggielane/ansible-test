---
# Soft type definitions for ALL environments (consumed by acme.windchill.types).
# Types are imported BEFORE object initialization rules: the oir role depends
# on the types role, so a rule for com.acme.Widget never runs before the type
# exists.
#
# Each entry is a load file exported from Windchill's Type and Attribute
# Management (or produced with an export definition file, see the role's
# README), saved under config/types/ and copied to the server as-is.
# Import is "replace" for each type in the file; global enumerations are
# never deleted. Order matters when a file's types extend another file's.
#
# The lab has its own list in group_vars/lab/types.yml (a child group wins).
windchill_types_files: []

# Example:
#
# windchill_types_files:
#   - name: acme_part_types                   # names the applied copy and the log
#     load_file: types/acme_part_types.xml    # relative to config/
#   - name: acme_document_types
#     load_file: types/acme_document_types.xml
