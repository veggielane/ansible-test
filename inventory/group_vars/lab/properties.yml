---
# LAB properties. Overrides the (empty) shared list in
# group_vars/windchill/properties.yml. The fake xconfmanager records them in
# C:\FakeWindchill\Windchill\site.xconf and "propagates" them to
# C:\FakeWindchill\Windchill\codebase\wt.properties. Change a value and
# re-run: only that property is set again.
windchill_properties:
  - name: wt.mail.from
    value: windchill@lab.example
  - name: wt.method.verboseClient
    value: 'false'
  - name: com.acme.lab.setting
    value: '30'
