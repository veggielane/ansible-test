---
# LAB soft type import. Overrides the (empty) shared list in
# group_vars/windchill/types.yml because lab is a child group of windchill.
# config/types/lab_part/ holds four placeholder files, one per kind a real
# type export produces; watch the play load them as enumerations, type
# definition, attributes, layouts regardless of their alphabetical order.
windchill_types_files:
  - name: lab_part
    load_dir: types/lab_part
