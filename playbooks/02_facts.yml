---
# Lesson 04a: facts = information Ansible gathers about a host before the tasks run.
# Run:  ansible-playbook playbooks/02_facts.yml        (add -v to see all facts)
- name: Lesson 04a - facts about the Windchill server
  hosts: "{{ target | default('lab') }}"   # environment to touch: -e target=dev|ppe|live (default: lab)
  gather_facts: true        # runs the "setup" module first; results become ansible_* variables

  tasks:
    - name: Show a few facts
      ansible.builtin.debug:      # debug prints things; it never changes the host
        msg:
          - "OS ............ {{ ansible_os_name }} ({{ ansible_distribution_version }})"
          - "Hostname ...... {{ ansible_hostname }}"
          - "Architecture .. {{ ansible_architecture }}"
          - "RAM ........... {{ ansible_memtotal_mb }} MB"
          - "Uptime ........ {{ (ansible_uptime_seconds / 3600) | round(1) }} h"

    # Want to see everything? This is long, but it shows what is available.
    - name: Dump all facts (only printed with -v)
      ansible.builtin.debug:
        var: ansible_facts
        verbosity: 1
