---
# Manage Windchill properties (site.xconf overrides) only.
#   ansible-playbook playbooks/windchill_properties.yml
#   ansible-playbook playbooks/windchill_properties.yml --check      # shows the plan, changes nothing
- name: Windchill - properties
  hosts: "{{ target | default('lab') }}"   # environment to touch: -e target=dev|ppe|live (default: lab)
  gather_facts: false

  roles:
    - acme.windchill.properties
