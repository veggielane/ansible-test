---
# The whole Windchill configuration: one role per configuration area, in the
# order Windchill needs. Roles come from the acme.windchill collection.
#   ansible-playbook playbooks/site.yml               # lab (default)
#   ansible-playbook playbooks/site.yml -e target=dev
#   ansible-playbook playbooks/site.yml --tags oir    # one area only
#   ansible-playbook playbooks/site.yml --list-tags   # which areas exist
- name: Windchill - full configuration
  hosts: "{{ target | default('lab') }}"   # environment to touch: -e target=dev|ppe|live (default: lab)
  gather_facts: false

  roles:
    # 1. Type icons: files under codebase\netmarkets\images that type definitions refer to.
    - role: acme.windchill.icons
      tags: [icons]

    # 2. Soft types: nothing that refers to a type can load before it exists.
    #    (types depends on icons, oir on types, so even --tags oir keeps this order.)
    - role: acme.windchill.types
      tags: [types]

    # 3. Object initialization rules
    - role: acme.windchill.oir
      tags: [oir]

    # Add future roles here in dependency order (tutorial/08-next-roles.md):
    # - role: acme.windchill.lifecycles
    #   tags: [lifecycles]
