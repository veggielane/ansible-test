---
# Copy type icons and other images into codebase\netmarkets\images only.
#   ansible-playbook playbooks/windchill_icons.yml
#   ansible-playbook playbooks/windchill_icons.yml --check --diff    # what would change
- name: Windchill - type icons
  hosts: "{{ target | default('lab') }}"   # environment to touch: -e target=dev|ppe|live (default: lab)
  gather_facts: false

  roles:
    - acme.windchill.icons
