---
# Load / update Windchill object initialization rules only.
#   ansible-playbook playbooks/windchill_oir.yml
#   ansible-playbook playbooks/windchill_oir.yml --check          # dry run
#   ansible-playbook playbooks/windchill_oir.yml -e windchill_oir_force=true
- name: Windchill - object initialization rules
  hosts: "{{ target | default('lab') }}"   # environment to touch: -e target=dev|ppe|live (default: lab)
  gather_facts: false

  roles:
    - acme.windchill.oir
