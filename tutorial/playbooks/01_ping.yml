---
# Lesson 03: the smallest useful playbook.
#
# A playbook is a list of PLAYS. A play = "on these hosts, run these tasks".
# Run:  ansible-playbook tutorial/playbooks/01_ping.yml
- name: Lesson 03 - can Ansible reach the Windchill servers?
  hosts: "{{ target | default('lab') }}"   # environment to touch: -e target=dev|ppe|live (default: lab)
  gather_facts: false       # skip the automatic "collect info about the host" step, for speed

  tasks:
    # A TASK calls one MODULE with some arguments.
    # ansible.windows.win_ping = collection "ansible.windows", module "win_ping".
    # It logs in, runs a tiny PowerShell snippet, and reports "pong".
    - name: WinRM/SSH round trip
      ansible.windows.win_ping:
