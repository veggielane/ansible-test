---
# The Windchill collection: this project's own roles, published to
# Artifactory from the ansible-collection-windchill repository.
#
# Installed into the control-node image only in "release mode" (an
# Artifactory URL and token given at build time, see tutorial/09). In "dev mode"
# (plain `docker compose build`) docker-compose.yml mounts your local checkout
# of the collection instead, so this file is not used.
collections:
  - name: acme.windchill
    version: "1.2.0"      # pin exactly; raise it deliberately, environment by environment
