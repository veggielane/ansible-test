# ansible.cfg - project-wide Ansible settings.
#
# Ansible looks for this file in the directory you run commands from
# (precedence: $ANSIBLE_CONFIG > ./ansible.cfg > ~/.ansible.cfg > /etc/ansible/ansible.cfg).
# The Docker control node sets ANSIBLE_CONFIG=/work/ansible.cfg explicitly, because
# Ansible refuses to auto-load a config from a world-writable directory and
# bind-mounted Windows folders look world-writable inside Linux containers.

[defaults]
# WHICH machines we manage: one inventory holding lab, dev, ppe and live groups.
# Playbooks default to the lab; pick another with -e target=dev (lesson 02).
inventory = inventory

# Roles come from the acme.windchill collection (lesson 09): in dev mode it is
# mounted from ../ansible-collection-windchill, in release mode it is installed
# in the image from Artifactory. docker-compose.yml sets ANSIBLE_COLLECTIONS_PATH.

# Print task results as YAML instead of one-line JSON. Far easier to read.
callback_result_format = yaml

# Print a per-task timing summary at the end of a run. Useful because
# Windchill loads can be slow. Needs the ansible.posix collection (requirements.yml).
callbacks_enabled = ansible.posix.profile_tasks

# Don't litter *.retry files next to playbooks when a host fails.
retry_files_enabled = False

# Only matters for the ssh connection type (lesson 02, alternative B).
host_key_checking = False

# How many hosts to work on in parallel. Irrelevant with one Windchill server
# per environment, but harmless.
forks = 10

# Lesson 06: uncomment this once you have created .vault_pass so you don't have
# to type --vault-password-file .vault_pass on every command.
# vault_password_file = .vault_pass
